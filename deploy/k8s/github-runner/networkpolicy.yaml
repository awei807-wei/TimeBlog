apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: timeblog-github-runner-deny-ingress
  labels:
    app.kubernetes.io/name: timeblog-github-runner
    app.kubernetes.io/part-of: timeblog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: timeblog-github-runner
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
