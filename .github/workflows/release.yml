name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: timeblog-release
  cancel-in-progress: false

env:
  CORE_IMAGE: ghcr.io/awei807-wei/timeblog-core
  WEB_IMAGE: ghcr.io/awei807-wei/timeblog-web
  REMOTE_DIR: /home/shiyi/TimeBlog

jobs:
  publish:
    name: Publish immutable images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ vars.TIMEBLOG_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      should_release: ${{ steps.freshness.outputs.should_release }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      core_digest: ${{ steps.core.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Record source commit
        id: source
        shell: bash
        run: printf 'head_sha=%s\n' '${{ github.event.workflow_run.head_sha }}' >> "$GITHUB_OUTPUT"

      - name: Verify the source is still current main
        id: freshness
        shell: bash
        env:
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$HEAD_SHA" == "$current_main_sha" ]]; then
            printf 'should_release=true\n' >> "$GITHUB_OUTPUT"
            echo "release source is current main: $HEAD_SHA"
          else
            printf 'should_release=false\n' >> "$GITHUB_OUTPUT"
            echo "stale workflow_run skipped: $HEAD_SHA is not current main ($current_main_sha)"
          fi

      - name: Set up persistent local Buildx
        if: steps.freshness.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          name: timeblog-release-builder
          keep-state: true
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "4GB"
              maxUsedSpace = "16GB"
              minFreeSpace = "2GB"

      - name: Log in to GHCR
        if: steps.freshness.outputs.should_release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core image
        id: core
        if: steps.freshness.outputs.should_release == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./services/core
          file: ./services/core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CORE_IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.CORE_IMAGE }}:main

      - name: Build and push web image
        id: web
        if: steps.freshness.outputs.should_release == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.WEB_IMAGE }}:main

  deploy:
    name: Deploy to production VPS
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.should_release == 'true' &&
      needs.publish.outputs.core_digest != '' &&
      needs.publish.outputs.web_digest != '' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
    concurrency:
      group: timeblog-production
      cancel-in-progress: false
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.head_sha }}
          fetch-depth: 1

      - name: Prepare SSH trust and key
        id: ssh
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/timeblog-deploy-key"
          known_hosts_file="$RUNNER_TEMP/timeblog-known-hosts"
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"
          printf 'key_file=%s\nknown_hosts_file=%s\n' "$key_file" "$known_hosts_file" >> "$GITHUB_OUTPUT"

      - name: Write digest-only release environment
        id: release_env
        shell: bash
        env:
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          CORE_DIGEST: ${{ needs.publish.outputs.core_digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          release_env="$RUNNER_TEMP/timeblog-release.env"
          {
            printf 'CORE_IMAGE=%s@%s\n' "$CORE_IMAGE" "$CORE_DIGEST"
            printf 'WEB_IMAGE=%s@%s\n' "$WEB_IMAGE" "$WEB_DIGEST"
            printf 'RELEASE_SHA=%s\n' "$HEAD_SHA"
            printf 'RELEASE_TAG=sha-%s\n' "$HEAD_SHA"
            printf 'RELEASE_CREATED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$release_env"
          chmod 0600 "$release_env"
          printf 'release_env=%s\n' "$release_env" >> "$GITHUB_OUTPUT"

      - name: Verify main is still current before remote access
        shell: bash
        env:
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            printf 'main advanced from %s to %s; refusing remote access for an older release\n' "$HEAD_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'origin/main is still %s; remote access may proceed\n' "$HEAD_SHA"

      - name: Verify target and preserve the VPS runtime environment
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "test -d '$REMOTE_DIR' && test -f '$REMOTE_DIR/deploy/.env'"

      - name: Stream the exact source archive without resetting the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          git cat-file -e "${HEAD_SHA}^{commit}"
          git archive --format=tar "$HEAD_SHA" | \
            ssh -i "$KEY_FILE" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              "tar --extract --file=- --directory='$REMOTE_DIR' --no-same-owner"

      - name: Upload digest-only release metadata
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          RELEASE_ENV: ${{ steps.release_env.outputs.release_env }}
        run: |
          set -Eeuo pipefail
          scp -q -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            "$RELEASE_ENV" \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/deploy/.release.incoming.env"

      - name: Verify main is still current before production SSH
        shell: bash
        env:
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            printf 'main advanced from %s to %s; refusing to deploy an older release\n' "$HEAD_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'origin/main is still %s; production SSH may proceed\n' "$HEAD_SHA"

      - name: Run the guarded remote release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -Eeuo pipefail
          ssh -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR='$REMOTE_DIR' RELEASE_ENV_FILE='$REMOTE_DIR/deploy/.release.incoming.env' '$REMOTE_DIR/deploy/release.sh'"
