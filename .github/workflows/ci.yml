name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: integration
  SITE_URL: http://localhost:3000
  SITE_HOST: localhost
  ADMIN_PASSWORD: integration-password
  ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
  TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  CONFIG_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  ACCOUNT_RECOVERY_KEY_BOOTSTRAP: integration-recovery-key-very-long
  TIMEBLOG_RUN_DATABASE_INTEGRATION: '1'

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: services/core/go.sum
      - name: Go unit tests
        run: go test ./...
        working-directory: services/core
      - name: Go vet
        run: go vet ./...
        working-directory: services/core
      - name: Migration ordering
        run: |
          test -f db/migrations/001_init.sql
          test -f db/migrations/002_incremental.sql
          test -f db/migrations/003_media_refs.sql
          test -f db/migrations/006_integration_settings.sql
          python3 -c "from pathlib import Path; s=Path('db/migrations/001_init.sql').read_text(); assert s.index('CREATE TABLE IF NOT EXISTS media (') < s.index('CREATE TABLE IF NOT EXISTS media_refs')"
        working-directory: services/core
      - name: OpenAPI contract checks
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('api/openapi.yaml').read_text(); ids=re.findall(r'^\\s+operationId:\\s+([^\\s#]+)',s,re.M); assert ids and len(ids)==len(set(ids))"
        working-directory: services/core
      - name: Compose config
        run: docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml config
      - name: Deployment static checks
        run: node --test deploy/compose.test.mjs deploy/github-runner.test.mjs deploy/nas-config-contract.test.mjs deploy/production-ssh-preflight.test.mjs deploy/release.test.mjs deploy/rotate-recovery-key.test.mjs
      - name: Start Postgres
        run: docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml up -d --wait postgres
      - name: Postgres integration tests
        run: go test ./...
        working-directory: services/core
        env:
          DATABASE_URL: postgres://timeline:integration@127.0.0.1:5432/timeline?sslmode=disable
      - if: always()
        name: Tear down compose
        run: docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml down -v
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate the production web build outside main release
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  container_contracts:
    name: Container contract (${{ matrix.image }})
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            context: services/core
            dockerfile: services/core/Dockerfile
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container contract
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" "$BUILD_CONTEXT"
