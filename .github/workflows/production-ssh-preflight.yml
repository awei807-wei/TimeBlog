name: Production SSH preflight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: timeblog-production-preflight
  cancel-in-progress: true

env:
  REMOTE_DIR: /home/shiyi/TimeBlog

jobs:
  preflight:
    name: Verify production SSH access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Validate secrets and SSH prerequisites
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          for secret_name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!secret_name}" ]]; then
              printf '::error::%s is empty or unavailable in the production environment\n' "$secret_name"
              exit 1
            fi
          done

          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            printf '::error::VPS_HOST has an unsupported format\n'
            exit 1
          fi
          if [[ ! "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            printf '::error::VPS_USER has an unsupported format\n'
            exit 1
          fi

          key_file="$RUNNER_TEMP/timeblog-preflight-key"
          known_hosts_file="$RUNNER_TEMP/timeblog-preflight-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"

          ssh-keygen -y -f "$key_file" > /dev/null
          ssh-keygen -F "$VPS_HOST" -f "$known_hosts_file" > /dev/null

          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          remote_dir=/home/shiyi/TimeBlog

          test -d "$remote_dir"
          test -d "$remote_dir/deploy"
          test -w "$remote_dir"
          test -w "$remote_dir/deploy"
          test -f "$remote_dir/deploy/.env"
          test ! -L "$remote_dir/deploy/.env"
          test -r "$remote_dir/deploy/.env"
          test "$(stat -c '%a' "$remote_dir/deploy/.env")" = 600
          command -v docker > /dev/null
          docker info > /dev/null
          docker compose version > /dev/null

          printf 'SSH login and read-only production prerequisites passed.\n'
          REMOTE
