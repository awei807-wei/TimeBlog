openapi: 3.0.3
info:
  title: Personal Timeline API
  version: 0.2.0
  description: |
    个人时间线博客 REST API。OpenAPI 是前后端唯一接口合同。
    写入接口使用同源 HttpOnly session cookie，并要求 X-CSRF-Token；创建、提交、导出和上传终结支持 Idempotency-Key。
servers:
  - url: /api/v1
tags:
  - name: health
  - name: public
  - name: auth
  - name: writing
  - name: taxonomy
  - name: media
  - name: exports
  - name: settings
paths:
  /public/timeline:
    get:
      tags: [public]
      operationId: getPublicTimeline
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: 按天分组的公开时间线, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /public/days/{date}:
    get:
      tags: [public]
      operationId: getPublicDay
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200': {description: 某天公开内容和私人占位, content: {application/json: {schema: {$ref: '#/components/schemas/DayResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/articles/{slug}:
    get:
      tags: [public]
      operationId: getPublicArticle
      parameters:
        - $ref: '#/components/parameters/ArticleIdentifier'
      responses:
        '200': {description: 公开文章, content: {application/json: {schema: {$ref: '#/components/schemas/PublicEntry'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/calendar:
    get:
      tags: [public]
      operationId: getPublicCalendar
      parameters:
        - name: month
          in: query
          required: true
          schema: {type: string, pattern: '^\\d{4}-\\d{2}$'}
      responses:
        '200': {description: 每日公开内容与私人占位的合计, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarResponse'}}}}
  /public/categories:
    get:
      tags: [public]
      operationId: listPublicCategories
      responses:
        '200': {description: 公开分类, content: {application/json: {schema: {$ref: '#/components/schemas/PublicCategoriesResponse'}}}}
  /public/categories/{slug}/entries:
    get:
      tags: [public]
      operationId: listPublicCategoryEntries
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: 分类公开内容, content: {application/json: {schema: {$ref: '#/components/schemas/EntryListResponse'}}}}
  /public/tags/{slug}/entries:
    get:
      tags: [public]
      operationId: listPublicTagEntries
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: 标签公开内容, content: {application/json: {schema: {$ref: '#/components/schemas/EntryListResponse'}}}}
  /public/search:
    get:
      tags: [public]
      operationId: searchPublicEntries
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: 公开搜索结果, content: {application/json: {schema: {$ref: '#/components/schemas/EntryListResponse'}}}}
  /public/feed:
    get:
      tags: [public]
      operationId: getPublicFeed
      responses:
        '200': {description: Atom feed, content: {application/atom+xml: {schema: {type: string}}}}

  /auth/login/password:
    post:
      tags: [auth]
      operationId: loginPassword
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordLoginRequest'}}}}
      responses:
        '200': {description: 短时 MFA challenge, content: {application/json: {schema: {$ref: '#/components/schemas/MFAChallengeResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login/totp:
    post:
      tags: [auth]
      operationId: loginTotp
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TOTPLoginRequest'}}}}
      responses:
        '200':
          description: 创建登录 session
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: 已注销, content: {application/json: {schema: {$ref: '#/components/schemas/OKResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/CSRF'}}
  /auth/session:
    get:
      tags: [auth]
      operationId: getAuthSession
      security: [SessionCookie: []]
      responses: {'200': {description: 当前 session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/session/status:
    get:
      tags: [auth]
      operationId: getAuthSessionStatus
      security: [SessionCookie: []]
      responses: {'200': {description: 当前 session 是否有效, content: {application/json: {schema: {$ref: '#/components/schemas/SessionStatusResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listAuthSessions
      security: [SessionCookie: []]
      responses: {'200': {description: 活动设备, content: {application/json: {schema: {$ref: '#/components/schemas/SessionListResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/SessionID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 已撤销}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/CSRF'}, '404': {$ref: '#/components/responses/NotFound'}}
  /auth/sessions/revoke-others:
    post:
      tags: [auth]
      operationId: revokeOtherSessions
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: 已撤销其他设备}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/CSRF'}}
  /auth/recovery/account:
    post:
      tags: [auth]
      operationId: recoverAccount
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryRequest'}}}}
      responses: {'200': {description: 恢复成功；同一 operationToken 与相同载荷可安全重试并返回相同凭据, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: operationToken 已用于不同载荷或恢复结果已被后续轮换替代}, '429': {description: 尝试次数过多, headers: {Retry-After: {schema: {type: string}}}}}

  /admin/working-copies:
    get:
      tags: [writing]
      operationId: listWorkingCopies
      security: [SessionCookie: []]
      responses: {'200': {description: 草稿托盘, content: {application/json: {schema: {$ref: '#/components/schemas/WorkingCopyListResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      tags: [writing]
      operationId: upsertWorkingCopy
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkingCopyCreateRequest'}}}}
      responses: {'200': {description: 幂等创建或更新草稿；clientDraftId 以 edit- 开头时仅允许更新仍存在的当前编辑代际，缺失时返回 409, content: {application/json: {schema: {$ref: '#/components/schemas/WorkingCopy'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/CSRF'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/working-copies/{id}:
    get:
      tags: [writing]
      operationId: getWorkingCopy
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/WorkingCopyID'}]
      responses: {'200': {description: 工作副本, content: {application/json: {schema: {$ref: '#/components/schemas/WorkingCopy'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [writing]
      operationId: patchWorkingCopy
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/WorkingCopyID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkingCopyPatchRequest'}}}}
      responses: {'200': {description: 已自动保存}, '409': {$ref: '#/components/responses/Conflict'}, '403': {$ref: '#/components/responses/CSRF'}}
    delete:
      tags: [writing]
      operationId: deleteWorkingCopy
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/WorkingCopyID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 已删除}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/working-copies/{id}/commit:
    post:
      tags: [writing]
      operationId: commitWorkingCopy
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/WorkingCopyID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommitRequest'}}}}
      responses: {'200': {description: 正式提交, content: {application/json: {schema: {$ref: '#/components/schemas/CommitResponse'}}}}, '409': {$ref: '#/components/responses/Conflict'}, '403': {$ref: '#/components/responses/CSRF'}}
  /admin/entries:
    get:
      tags: [writing]
      operationId: listAdminEntries
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: status, in: query, schema: {$ref: '#/components/schemas/EntryStatus'}}, {name: visibility, in: query, schema: {$ref: '#/components/schemas/Visibility'}}, {name: kind, in: query, schema: {$ref: '#/components/schemas/EntryKind'}}]
      responses: {'200': {description: 后台内容列表, content: {application/json: {schema: {$ref: '#/components/schemas/EntryListResponse'}}}}}
  /admin/entries/{id}:
    get:
      tags: [writing]
      operationId: getAdminEntry
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}]
      responses: {'200': {description: 完整私有内容, content: {application/json: {schema: {$ref: '#/components/schemas/Entry'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
    delete:
      tags: [writing]
      operationId: trashEntry
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 进入回收站}, '403': {$ref: '#/components/responses/CSRF'}}
  /admin/entries/{id}/edit:
    post:
      tags: [writing]
      operationId: editEntry
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}, {name: discard, in: query, description: 丢弃该 entry 当前 owner 的编辑工作副本并从最新正式内容重建, schema: {type: integer, enum: [1]}}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {description: 创建或恢复编辑工作副本；discard=1 时先丢弃当前 entry 工作副本再重建, content: {application/json: {schema: {$ref: '#/components/schemas/WorkingCopy'}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/entries/{id}/restore:
    post:
      tags: [writing]
      operationId: restoreEntry
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 恢复回收站内容}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/entries/{id}/purge:
    post:
      tags: [writing]
      operationId: purgeEntry
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 永久删除}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/entries/{id}/versions:
    get:
      tags: [writing]
      operationId: listEntryVersions
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}]
      responses: {'200': {description: 最近 20 个文章版本, content: {application/json: {schema: {$ref: '#/components/schemas/VersionListResponse'}}}}}
  /admin/entries/{id}/versions/{version}/restore:
    post:
      tags: [writing]
      operationId: restoreEntryVersion
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/Version'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 从历史快照创建新版本}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/undo/{token}:
    post:
      tags: [writing]
      operationId: undoEntry
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/UndoToken'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: 15 秒内撤销短记录；响应中的 entry 与提交响应保持一致并用于回填编辑器, content: {application/json: {schema: {$ref: '#/components/schemas/CommitResponse'}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /admin/categories:
    get:
      tags: [taxonomy]
      operationId: listCategories
      security: [SessionCookie: []]
      responses: {'200': {description: 分类列表, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryListResponse'}}}}}
    post:
      tags: [taxonomy]
      operationId: createCategory
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRequest'}}}}
      responses: {'201': {description: 分类已创建, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}}
  /admin/categories/{id}:
    patch:
      tags: [taxonomy]
      operationId: updateCategory
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CategoryID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRequest'}}}}
      responses: {'200': {description: 分类已更新}}
    delete:
      tags: [taxonomy]
      operationId: deleteCategory
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CategoryID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 删除分类并保留内容}}
  /admin/tags:
    get:
      tags: [taxonomy]
      operationId: listTags
      security: [SessionCookie: []]
      responses: {'200': {description: 标签列表, content: {application/json: {schema: {$ref: '#/components/schemas/TagListResponse'}}}}}
    post:
      tags: [taxonomy]
      operationId: createTag
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TagRequest'}}}}
      responses: {'201': {description: 标签已创建, content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}}}
  /admin/tags/{id}:
    patch:
      tags: [taxonomy]
      operationId: updateTag
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/TagID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TagRequest'}}}}
      responses: {'200': {description: 标签已更新}}
    delete:
      tags: [taxonomy]
      operationId: deleteTag
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/TagID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'200': {description: 删除标签}}

  /admin/media/upload-ticket:
    post:
      description: 单文件大小受 MAX_UPLOAD_BYTES 限制（默认 200 MiB；允许范围 1 MiB–2 GiB）。
      tags: [media]
      operationId: createUploadTicket
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadTicketRequest'}}}}
      responses: {'201': {description: 上传票据, content: {application/json: {schema: {$ref: '#/components/schemas/UploadTicketResponse'}}}}, '413': {$ref: '#/components/responses/PayloadTooLarge'}}
  /admin/media/capability:
    get:
      description: 返回服务端媒体存储能力。规范原件始终为 local_private；externalPublic.publishEnabled 仅表示图片完成后是否会异步排入外部图床发布，不改变本地原件保留策略。writable 由 API 对媒体卷执行安全写入探测得出。
      tags: [media]
      operationId: getMediaCapability
      security: [SessionCookie: []]
      responses: {'200': {description: 媒体存储能力, content: {application/json: {schema: {type: object, required: [provider,writable,imageUploadEnabled,nonImageUploadEnabled], properties: {provider: {type: string}, writable: {type: boolean}, imageUploadEnabled: {type: boolean}, nonImageUploadEnabled: {type: boolean}, reason: {type: string}}}}}}}
  /admin/media/{id}/finalize:
    post:
      tags: [media]
      operationId: finalizeMedia
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/MediaID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {}}}}}
      responses: {'200': {description: 媒体已校验并就绪, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}}
  /admin/media/{id}/upload:
    head:
      tags: [media]
      operationId: getMediaUploadOffset
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/MediaID'}]
      responses: {'204': {description: 当前上传偏移, headers: {Upload-Offset: {schema: {type: integer, format: int64}}, Tus-Resumable: {schema: {type: string}}}}}
    patch:
      tags: [media]
      operationId: appendMediaUpload
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/MediaID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {name: Upload-Offset, in: header, required: true, schema: {type: integer, format: int64}}]
      requestBody: {required: true, content: {application/offset+octet-stream: {schema: {type: string, format: binary}}}}
      responses: {'204': {description: 分片已追加, headers: {Upload-Offset: {schema: {type: integer, format: int64}}, Tus-Resumable: {schema: {type: string}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/media:
    get:
      tags: [media]
      operationId: listMedia
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: q, in: query, schema: {type: string}}]
      responses: {'200': {description: 媒体库, content: {application/json: {schema: {$ref: '#/components/schemas/MediaListResponse'}}}}}
  /admin/media/{id}:
    get:
      tags: [media]
      operationId: getMedia
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/MediaID'}]
      responses: {'200': {description: 媒体元数据, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}}
    delete:
      tags: [media]
      operationId: deleteMedia
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/MediaID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'204': {description: 已标记删除并排队清理；上传中的媒体会同时取消并清理临时文件}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/media/{id}/retry-publish:
    post:
      tags: [media]
      operationId: retryExternalMediaPublish
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/MediaID'}, {$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      responses: {'202': {description: 已重新排队外部发布}, '409': {$ref: '#/components/responses/Conflict'}}
  /media/{id}/content:
    get:
      tags: [media]
      operationId: getMediaContent
      parameters: [{$ref: '#/components/parameters/MediaID'}, {name: Range, in: header, schema: {type: string}}, {name: If-None-Match, in: header, schema: {type: string}}]
      responses: {'200': {description: 媒体内容, headers: {ETag: {schema: {type: string}}, Accept-Ranges: {schema: {type: string}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, '206': {description: 部分媒体内容}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/embeds/resolve:
    post:
      tags: [media]
      operationId: resolveEmbed
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmbedRequest'}}}}
      responses: {'200': {description: 受控嵌入结构}}

  /admin/exports:
    get:
      tags: [exports]
      operationId: listExports
      security: [SessionCookie: []]
      responses: {'200': {description: 导出任务列表, content: {application/json: {schema: {$ref: '#/components/schemas/ExportListResponse'}}}}}
    post:
      tags: [exports]
      operationId: createExport
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExportRequest'}}}}
      responses: {'202': {description: 导出任务已排队, content: {application/json: {schema: {$ref: '#/components/schemas/Export'}}}}}
  /admin/exports/{id}/download:
    get:
      tags: [exports]
      operationId: downloadExport
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/ExportID'}]
      responses: {'200': {description: ZIP 文件, content: {application/zip: {schema: {type: string, format: binary}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/imports/dry-run:
    post:
      tags: [exports]
      operationId: dryRunImport
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/zip: {schema: {type: string, format: binary}}}}
      responses: {'200': {description: 导入预览, content: {application/json: {schema: {$ref: '#/components/schemas/ImportDryRunResponse'}}}}}
  /admin/imports:
    post:
      tags: [exports]
      operationId: importExport
      security: [SessionCookie: []]
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - {name: conflictPolicy, in: query, required: false, schema: {type: string, enum: [skip, replace, remap], description: 未指定且出现冲突时返回409}}
      requestBody: {required: true, content: {application/zip: {schema: {type: string, format: binary}}}}
      responses: {'201': {description: 导入完成}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}}

  /admin/calendar:
    get:
      tags: [calendar]
      operationId: getAdminCalendar
      security: [SessionCookie: []]
      parameters:
        - {name: year, in: query, required: false, schema: {type: string, pattern: '^[0-9]{4}$'}}
        - {name: includeDrafts, in: query, required: false, schema: {type: boolean, default: false}}
      responses: {'200': {description: 按日期的公开/私人/草稿/回收站计数}}

  /admin/settings:
    get:
      tags: [settings]
      operationId: getSettings
      security: [SessionCookie: []]
      responses: {'200': {description: 设置}}
    patch:
      tags: [settings]
      operationId: updateSettings
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteSettingsPatch'}}}}
      responses: {'200': {description: 设置已更新}, '400': {$ref: '#/components/responses/BadRequest'}, '405': {description: 方法不允许}}

  /admin/runtime-status:
    get:
      tags: [settings]
      operationId: getAdminRuntimeStatus
      security: [SessionCookie: []]
      responses:
        '200': {description: 非敏感运行状态, headers: {Cache-Control: {schema: {type: string}, description: 必须为 no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '405': {description: 方法不允许}

  /admin/integrations/external_image_host:
    get:
      tags: [settings]
      operationId: getExternalImageHostConfig
      security: [SessionCookie: []]
      responses: {'200': {description: 图床配置；Token 仅返回掩码状态。publishEnabled 只有在 enabled、stablePublicUrls、Token 已配置且 probeStatus 为 verified 或 scope_limited 时才为 true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalImageHostConfig'}}}}}
    patch:
      tags: [settings]
      operationId: updateExternalImageHostConfig
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalImageHostPatch'}}}}
      responses: {'200': {description: 配置已加密入库；启用门禁由协议、凭据和稳定 URL 确认共同决定}, '400': {$ref: '#/components/responses/BadRequest'}}

  /admin/integrations/external_image_host/test:
    post:
      tags: [settings]
      operationId: probeExternalImageHost
      description: 使用临时 Token 或已保存 Token 调用 GET /api/uploads?limit=1；不会上传或删除文件。只有 images:write 而缺少 images:read 时返回 scope_limited。
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalImageHostProbeRequest'}}}}
      responses: {'200': {description: 无副作用认证探测结果，protocolStatus 为 ou_image_hosting_v1}, '400': {$ref: '#/components/responses/BadRequest'}}

  /admin/integrations/nas_backup:
    get:
      tags: [settings]
      operationId: getNASBackupConfig
      security: [SessionCookie: []]
      responses: {'200': {description: NAS pull 策略, content: {application/json: {schema: {$ref: '#/components/schemas/NASBackupConfig'}}}}}
    patch:
      tags: [settings]
      operationId: updateNASBackupConfig
      security: [SessionCookie: []]
      parameters: [{$ref: '#/components/parameters/CSRF'}, {$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NASBackupPatch'}}}}
      responses: {'200': {description: NAS pull 策略已入库，等待安全导出应用}, '400': {$ref: '#/components/responses/BadRequest'}}

  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      responses: {'200': {description: 进程存活, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}}
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      responses: {'200': {description: 依赖就绪, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}, '503': {$ref: '#/components/responses/Problem'}}

components:
  securitySchemes:
    SessionCookie: {type: apiKey, in: cookie, name: timeline_session, description: HttpOnly SameSite=Lax session cookie; production sets Secure}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Date: {name: date, in: path, required: true, schema: {type: string, format: date}}
    ArticleIdentifier: {name: slug, in: path, required: true, description: 公开文章使用 canonical slug；历史空 slug 文章允许使用合法 UUID entry ID 回退查询，slug 匹配优先，非 UUID ID 不接受, schema: {type: string, minLength: 1, maxLength: 200}}
    Slug: {name: slug, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 16}}
    Origin: {name: Origin, in: header, required: false, schema: {type: string, format: uri}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 200}}
    SessionID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    WorkingCopyID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    EntryID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    CategoryID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    TagID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    MediaID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    ExportID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    UndoToken: {name: token, in: path, required: true, schema: {type: string}}
    Version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 20}}
  headers:
    SessionCookie: {description: HttpOnly session cookie, schema: {type: string}}
  responses:
    Problem: {description: Problem Details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    BadRequest: {description: 请求无效, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unauthorized: {description: 未认证, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: 禁止访问, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    CSRF: {description: CSRF 或来源校验失败, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: 乐观锁或资源冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemConflict'}}}}
    NotFound: {description: 资源不存在, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PayloadTooLarge: {description: 文件超过配置限制, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    SiteSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        siteTitle: {type: string}
        siteDescription: {type: string}
        timezone: {type: string}
        defaultVisibility: {type: string, enum: [public, private]}
        feedEnabled: {type: boolean}
        theme: {type: string}
    SecretMutation:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [keep, replace, clear]}
        value: {type: string, writeOnly: true, maxLength: 8192}
    ExternalImageHostPatch:
      type: object
      additionalProperties: false
      required: [enabled, endpoint, stablePublicUrls, syncDeletes, token]
      properties:
        enabled: {type: boolean}
        endpoint: {type: string, format: uri, default: 'https://image.cainiao.me/api/uploads'}
        workspaceId: {type: string, maxLength: 80}
        stablePublicUrls: {type: boolean, description: 管理员确认未使用短期签名 URL 且防盗链允许博客域名}
        syncDeletes: {type: boolean, description: 永久删除本地媒体前将远端副本移入回收站；需要 images:delete}
        token: {$ref: '#/components/schemas/SecretMutation'}
    ExternalImageHostConfig:
      type: object
      additionalProperties: false
      required: [provider, enabled, endpoint, stablePublicUrls, syncDeletes, tokenConfigured, tokenMasked, protocolStatus, verified, publishEnabled, status]
      properties:
        provider: {type: string, enum: [custom_public]}
        enabled: {type: boolean}
        endpoint: {type: string, format: uri}
        workspaceId: {type: string}
        stablePublicUrls: {type: boolean}
        syncDeletes: {type: boolean}
        tokenConfigured: {type: boolean}
        tokenMasked: {type: string, enum: ['', '********']}
        protocolStatus: {type: string, enum: [ou_image_hosting_v1]}
        verified: {type: boolean}
        publishEnabled: {type: boolean}
        status: {type: string}
        statusMessage: {type: string}
        lastTestedAt: {type: [string, 'null'], format: date-time}
        updatedAt: {type: string, format: date-time}
    ExternalImageHostProbeRequest:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: {type: string, format: uri, description: 仅用于本次无副作用探测，不会入库}
        workspaceId: {type: string, maxLength: 80}
        token: {type: string, writeOnly: true, description: 可选临时 Token；留空时使用已加密保存值}
    NASBackupPatch:
      type: object
      additionalProperties: false
      required: [enabled, sourceHost, sourcePath, destinationPath, retentionDays]
      properties:
        enabled: {type: boolean}
        sourceHost: {type: string, maxLength: 255}
        sourcePath: {type: string, maxLength: 1024}
        destinationPath: {type: string, maxLength: 1024}
        retentionDays: {type: integer, minimum: 1, maximum: 3650}
    NASBackupConfig:
      allOf:
        - {$ref: '#/components/schemas/NASBackupPatch'}
        - type: object
          required: [applyStatus, status]
          properties:
            applyStatus: {type: string, enum: [pending_export]}
            status: {type: string}
            statusMessage: {type: string}
            lastTestedAt: {type: [string, 'null'], format: date-time}
            updatedAt: {type: string, format: date-time}
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [updatedAt, media, externalImageHost, security, nasBackup]
      properties:
        updatedAt: {type: string, format: date-time}
        media:
          type: object
          additionalProperties: false
          required: [provider, writable, imageUploadEnabled, nonImageUploadEnabled, maxUploadBytes]
          properties:
            provider: {type: string, enum: [local_private]}
            writable: {type: boolean}
            imageUploadEnabled: {type: boolean}
            nonImageUploadEnabled: {type: boolean}
            maxUploadBytes: {type: integer, format: int64}
        externalImageHost:
          type: object
          additionalProperties: false
          required: [provider, configured, enabled, protocolStatus, status]
          properties:
            provider: {type: string, enum: [custom_public]}
            configured: {type: boolean}
            enabled: {type: boolean}
            protocolStatus: {type: string, enum: [ou_image_hosting_v1]}
            probeStatus: {type: string}
            publishEnabled: {type: boolean}
            status: {type: string}
        security:
          type: object
          additionalProperties: false
          required: [adminPassword, adminTotpSecret, totpEncryptionKey, databaseConnection, accountRecoveryKey]
          properties:
            adminPassword: {$ref: '#/components/schemas/ConfiguredStatus'}
            adminTotpSecret: {$ref: '#/components/schemas/ConfiguredStatus'}
            totpEncryptionKey: {$ref: '#/components/schemas/ConfiguredStatus'}
            databaseConnection: {$ref: '#/components/schemas/ConfiguredStatus'}
            accountRecoveryKey: {$ref: '#/components/schemas/ConfiguredStatus'}
        nasBackup:
          type: object
          additionalProperties: false
          required: [configured, enabled, applyStatus, status]
          properties:
            configured: {type: boolean}
            enabled: {type: boolean}
            applyStatus: {type: string}
            status: {type: string}
    ConfiguredStatus:
      type: object
      additionalProperties: false
      required: [configured, managedBy]
      properties:
        configured: {type: boolean}
        managedBy: {type: string}
    EntryKind: {type: string, enum: [note, article]}
    EntryStatus: {type: string, enum: [draft, published, trashed]}
    Visibility: {type: string, enum: [public, private]}
    Entry:
      type: object
      required: [id, kind, status, visibility, markdown, journalDate, timePrecision, revision]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/EntryKind'}
        status: {$ref: '#/components/schemas/EntryStatus'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        title: {type: string}
        slug: {type: string, description: 文章保存后稳定的 canonical slug；历史导入的空 slug 文章仍可通过 UUID entry ID 读取}
        summary: {type: string}
        markdown: {type: string}
        renderedHtml: {type: string}
        plainText: {type: string}
        journalDate: {type: string, format: date}
        journalTime:
          type: string
          nullable: true
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d{1,6})?)?$'
          description: 内存响应使用 HH:MM；PostgreSQL time::text 响应使用 HH:MM:SS，并可能包含最多 6 位小数秒
        timePrecision: {type: string, enum: [day, minute]}
        dayPosition: {type: integer}
        revision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        categories: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
    PrivatePlaceholder:
      type: object
      required: [visibility, journalDate, placeholder, text]
      additionalProperties: false
      properties:
        visibility: {type: string, enum: [private]}
        journalDate: {type: string, format: date}
        journalTime: {type: string, nullable: true}
        placeholder: {type: boolean, const: true}
        text: {type: string, enum: ['这是一条私人记录 🔒']}
    PublicEntry:
      oneOf: [{$ref: '#/components/schemas/Entry'}, {$ref: '#/components/schemas/PrivatePlaceholder'}]
    Day:
      type: object
      required: [date, untimed, timed]
      properties:
        date: {type: string, format: date}
        untimed: {type: array, items: {$ref: '#/components/schemas/PublicEntry'}}
        timed: {type: array, items: {$ref: '#/components/schemas/PublicEntry'}}
    TimelineResponse:
      type: object
      required: [days, targetLimit, actualCount]
      properties:
        days: {type: array, items: {$ref: '#/components/schemas/Day'}}
        nextCursor: {type: string}
        targetLimit: {type: integer}
        actualCount: {type: integer}
    DayResponse: {type: object, required: [date, untimed, timed], properties: {date: {type: string, format: date}, untimed: {type: array, items: {$ref: '#/components/schemas/PublicEntry'}}, timed: {type: array, items: {$ref: '#/components/schemas/PublicEntry'}}}}
    EntryListResponse: {type: object, required: [entries], properties: {entries: {type: array, items: {$ref: '#/components/schemas/PublicEntry'}}, nextCursor: {type: string}}}
    CalendarResponse: {type: object, required: [month, days], properties: {month: {type: string}, days: {type: object, additionalProperties: {type: integer}}}}
    PublicCategoriesResponse: {type: object, required: [categories], properties: {categories: {type: object, additionalProperties: {type: integer}}}}
    PasswordLoginRequest: {type: object, required: [password], properties: {password: {type: string, format: password}}}
    MFAChallengeResponse: {type: object, required: [challenge, requiresTotp], properties: {challenge: {type: string}, requiresTotp: {type: boolean}}}
    TOTPLoginRequest: {type: object, required: [challenge, code], properties: {challenge: {type: string}, code: {type: string, minLength: 6, maxLength: 8}}}
    SessionResponse: {type: object, required: [authenticated, csrfToken], properties: {authenticated: {type: boolean}, username: {type: string}, csrfToken: {type: string}, idleExpiresInDays: {type: integer}, absoluteExpiresInDays: {type: integer}}}
    SessionStatusResponse: {type: object, required: [authenticated, csrfToken], properties: {authenticated: {type: boolean}, username: {type: string}, csrfToken: {type: string, description: 当前会话稳定的 CSRF token；不会因重复读取 session 状态而轮换}}}
    Session: {type: object, required: [id, createdAt, lastSeen], properties: {id: {type: string, format: uuid}, createdAt: {type: string, format: date-time}, lastSeen: {type: string, format: date-time}}}
    SessionListResponse: {type: object, required: [sessions], properties: {sessions: {type: array, items: {$ref: '#/components/schemas/Session'}}}}
    RecoveryRequest: {type: object, required: [recoveryKey, newPassword, operationToken, newRecoveryKey, newTotpSecret], properties: {recoveryKey: {type: string}, newPassword: {type: string, format: password, minLength: 12, maxLength: 1024}, operationToken: {type: string, description: 客户端生成的 256-bit base64url 幂等令牌}, newRecoveryKey: {type: string, description: 客户端生成的 256-bit base64url 新恢复密钥}, newTotpSecret: {type: string, description: 客户端生成的 160-bit 无填充 Base32 TOTP 密钥}}}
    RecoveryResponse: {type: object, required: [ok, recoveryKey, totpSetupURI], properties: {ok: {type: boolean}, recoveryKey: {type: string, description: 服务端不保存明文；由幂等请求原样返回}, totpSetupURI: {type: string, description: 由幂等请求中的 TOTP 密钥重建}}}
    WorkingCopy:
      type: object
      required: [id, clientDraftId, payload, updatedAt]
      properties:
        id: {type: string, format: uuid}
        clientDraftId: {type: string}
        entryId: {type: string, format: uuid, nullable: true}
        baseRevision: {type: integer, format: int64}
        payload: {type: object, additionalProperties: true}
        updatedAt: {type: string, format: date-time}
        resumed: {type: boolean, description: 是否恢复了该 entry 已存在的编辑工作副本}
        hasUnpublishedChanges: {type: boolean, description: 工作副本相对当前正式 entry 是否存在未提交差异}
        publishedRevision: {type: integer, format: int64, description: 当前正式 entry 的 revision}
        publishedUpdatedAt: {type: string, format: date-time, nullable: true, description: 当前正式 entry 的 updatedAt}
        publishedStatus: {type: string, enum: [draft, published, trashed], description: 当前正式 entry 的 status}
        publishedVisibility: {type: string, enum: [public, private], description: 当前正式 entry 的 visibility}
        publishedSlug: {type: string, description: 当前正式 entry 的 slug；无 slug 时为空字符串}
    WorkingCopyCreateRequest: {type: object, required: [clientDraftId, payload], description: clientDraftId 以 edit- 开头时服务端采用 update-only 语义；对应工作副本缺失或已被 discard/commit 替换时返回 409，不会自动创建新代际, properties: {clientDraftId: {type: string}, payload: {type: object, additionalProperties: true}}}
    WorkingCopyPatchRequest: {type: object, required: [payload], properties: {baseRevision: {type: integer, format: int64}, payload: {type: object, additionalProperties: true}}}
    WorkingCopyListResponse: {type: object, required: [workingCopies], properties: {workingCopies: {type: array, items: {$ref: '#/components/schemas/WorkingCopy'}}}}
    CommitRequest: {type: object, required: [markdown, status, visibility, journalDate], properties: {kind: {$ref: '#/components/schemas/EntryKind'}, status: {$ref: '#/components/schemas/EntryStatus'}, visibility: {$ref: '#/components/schemas/Visibility'}, title: {type: string}, slug: {type: string}, summary: {type: string}, markdown: {type: string}, journalDate: {type: string, format: date}, journalTime: {type: string, nullable: true}, categories: {type: array, items: {type: string}, description: 未提供时继承工作副本；传空数组清空已有分类}, tags: {type: array, items: {type: string}, description: 未提供时继承工作副本并合并正文 hashtag；提供数组后仅使用该数组，空数组清空已有标签}, baseRevision: {type: integer, format: int64}}}
    CommitResponse: {type: object, required: [entry], properties: {entry: {$ref: '#/components/schemas/Entry'}, undoToken: {type: string}}}
    Category: {type: object, required: [id, name, slug], properties: {id: {type: string, format: uuid}, name: {type: string}, slug: {type: string}, description: {type: string}}}
    CategoryRequest: {type: object, required: [name], properties: {name: {type: string}, slug: {type: string}, description: {type: string}}}
    CategoryListResponse: {type: object, required: [categories], properties: {categories: {type: array, items: {$ref: '#/components/schemas/Category'}}}}
    Tag: {type: object, required: [id, displayName, normalizedName, slug], properties: {id: {type: string, format: uuid}, displayName: {type: string}, normalizedName: {type: string}, slug: {type: string}}}
    TagRequest: {type: object, required: [displayName], properties: {displayName: {type: string}, slug: {type: string}}}
    TagListResponse: {type: object, required: [tags], properties: {tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}}}
    UploadTicketRequest: {type: object, required: [name, size, mime, visibility], properties: {name: {type: string}, size: {type: integer, format: int64}, mime: {type: string}, visibility: {$ref: '#/components/schemas/Visibility'}}}
    UploadTicketResponse: {type: object, required: [media, uploadUrl, finalizeUrl], properties: {media: {$ref: '#/components/schemas/Media'}, uploadUrl: {type: string, description: PATCH/HEAD resumable upload URL}, finalizeUrl: {type: string, description: POST metadata-only finalize URL}, expiresIn: {type: integer}}}
    Media: {type: object, required: [id, originalName, mimeType, sizeBytes, visibility, status], properties: {id: {type: string, format: uuid}, originalName: {type: string}, mimeType: {type: string}, sizeBytes: {type: integer, format: int64}, visibility: {$ref: '#/components/schemas/Visibility'}, status: {type: string, enum: [uploading, ready, failed, deleting, deleted]}, provider: {type: string, enum: [local_private, custom_public]}, providerKey: {type: string}, publicUrl: {type: string, format: uri}, externalPublishStatus: {type: string, enum: [not_requested, pending, publishing, published, failed, trash_pending]}, externalPublishError: {type: string}, sha256: {type: string}, createdAt: {type: string, format: date-time}}}
    MediaListResponse: {type: object, required: [media], properties: {media: {type: array, items: {$ref: '#/components/schemas/Media'}}, nextCursor: {type: string}}}
    EmbedRequest: {type: object, required: [url], properties: {url: {type: string, format: uri}}}
    ExportRequest: {type: object, required: [type], properties: {type: {type: string, enum: [public, full]}}}
    Export: {type: object, required: [id, type, status], properties: {id: {type: string, format: uuid}, type: {type: string, enum: [public, full]}, status: {type: string, enum: [queued, running, ready, failed]}, downloadUrl: {type: string}, sha256: {type: string}}}
    ExportListResponse: {type: object, required: [exports], properties: {exports: {type: array, items: {$ref: '#/components/schemas/Export'}}}}
